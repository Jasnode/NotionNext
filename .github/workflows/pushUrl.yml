## 每周检查线上站点地图，只把新增或内容发生变化的 URL 推送给搜索引擎 ##

name: pushUrl

# 触发方式说明：
#   1. 每周定时一次：本博客文章存储在 Notion 并动态渲染，发布文章不需要 Git 提交，
#      因此这里刻意**不带 push 触发**（旧版带 push，导致每次合并上游都会空跑一次）。
#      变更检测的依据是线上站点实际呈现的内容，而非 Git 历史。
#   2. workflow_dispatch：手动触发，可选 dry_run 预览或 force 全量重推。
on:
  schedule:
    # 每周一与周四各一次，UTC 03:37（北京时间 11:37）。避开整点，减少 cron 排队延迟。
    #
    # 为什么是两次而不是每周一次：记录各 URL 状态的 actions/cache 有
    # 「7 天未被访问即回收」的规则。若只每周跑一次，间隔正好卡在 7 天边界，
    # 而 GitHub cron 又常有延迟，缓存极易被回收，导致每次都退化成全量重推——
    # 那就又回到「重复推送未变更 URL」的老问题上了。
    # 两次运行把最大间隔压到 4 天，远低于回收阈值。
    # 单次成本极低（只读一次 sitemap，约 1 秒），不产生额外负担。
    - cron: '37 3 * * 1'
    - cron: '37 3 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅预览将推送的 URL，不实际发送'
        type: boolean
        default: false
      force:
        description: '忽略历史状态，全量重推（违反最佳实践，仅在通道失效后重建基线时使用）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pushurl-production
  cancel-in-progress: false

jobs:
  bot:
    # 防止 fork 副本或非默认分支误用生产环境的推送配额。
    # 仓库链路：tangly1024/NotionNext → 88lin/HeoLume（开发）→ Jasnode/NotionNext（上线部署）。
    # 三个名字都放行，避免改名或跨 fork 后守卫失效导致任务静默跳过。
    if: >-
      (github.repository == 'Jasnode/NotionNext' ||
       github.repository == '88lin/HeoLume' ||
       github.repository == '88lin/NotionNext') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout codes
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 恢复上一次成功推送的记录，用于计算增量。
      # 记录内容是各 URL 的 sitemap lastmod，不是页面正文，因此体积很小。
      # 注意：cache 可能被回收，一旦丢失会退化为一次全量推送，日志里会明确标注，不会产生错误数据。
      # actions/cache 使用独立的 runtime token，不受上面 permissions 影响。
      - name: Restore previous submission record
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/pushurl-state
          key: pushurl-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pushurl-state-v1-

      - name: Push changed URLs
        id: push
        env:
          # 站点地址与 IndexNow key 都不是机密：key 文件已随仓库部署在
          # public/183aae36d3d545428d2f5e84eb5acd12.txt，线上可直接访问，
          # IndexNow 正是靠这个可访问性来校验站点归属。
          # 这里直接给默认值，未配置 secrets 也能立即工作；要覆盖再配同名 secret 即可。
          URL: ${{ secrets.URL || 'https://blog.88lin.eu.org' }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY || '183aae36d3d545428d2f5e84eb5acd12' }}
          # 以下两项不再启用，故不传：
          #   百度——站点暂时无法在百度站长平台添加，待可用后再放开
          #   Bing Webmaster API——IndexNow 已覆盖必应，且该接口每日配额仅 35 条，
          #     而本站有 65 个页面，首次全量必然超额并持续失败，属重复消耗。
          #     若确需启用，把下面这行放开即可（脚本已能识别配额不足并给出提示）。
          # BING_API_KEY: ${{ secrets.BING_API_KEY }}
          # runner 上下文只能用于 step 级别，不能写在 job 级别的 env 里
          STATE_DIR: ${{ runner.temp }}/pushurl-state
        run: |
          extra_flags=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            extra_flags="--dry_run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            extra_flags="$extra_flags --force"
          fi
          python pushUrl.py --url "$URL" --state_dir "$STATE_DIR" $extra_flags

      # 仅在确实完成推送时才写回缓存，避免无变更时产生无意义的缓存条目
      - name: Save submission record
        if: steps.push.outputs.pushed == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/pushurl-state
          key: ${{ steps.cache.outputs.cache-primary-key }}

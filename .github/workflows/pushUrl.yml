## 每周检查线上站点地图，只把新增或内容发生变化的 URL 推送给搜索引擎 ##

name: pushUrl

# 触发方式说明：
#   1. 每周定时一次：本博客文章存储在 Notion 并动态渲染，发布文章不需要 Git 提交，
#      因此这里刻意**不带 push 触发**（旧版带 push，导致每次合并上游都会空跑一次）。
#      变更检测的依据是线上站点实际呈现的内容，而非 Git 历史。
#   2. workflow_dispatch：手动触发，可选 dry_run 预览或 force 全量重推。
on:
  schedule:
    # 每周一 UTC 03:37（北京时间 11:37）。避开整点，减少 GitHub cron 排队延迟。
    - cron: '37 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅预览将推送的 URL，不实际发送'
        type: boolean
        default: false
      force:
        description: '忽略历史状态，全量重推（违反最佳实践，仅在通道失效后重建基线时使用）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pushurl-production
  cancel-in-progress: false

jobs:
  bot:
    # 防止 fork 副本或非默认分支误用生产环境的推送配额。
    # 仓库链路：tangly1024/NotionNext → 88lin/HeoLume（开发）→ Jasnode/NotionNext（上线部署）。
    # 三个名字都放行，避免改名或跨 fork 后守卫失效导致任务静默跳过。
    if: >-
      (github.repository == 'Jasnode/NotionNext' ||
       github.repository == '88lin/HeoLume' ||
       github.repository == '88lin/NotionNext') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout codes
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 恢复上一次成功推送的页面指纹，用于计算增量。
      # 注意：cache 有被回收的可能，一旦丢失会退化为一次全量推送并记录在日志里，
      # 不会造成错误数据。actions/cache 使用独立的 runtime token，不受上面 permissions 影响。
      - name: Restore previous submission fingerprints
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/pushurl-state
          key: pushurl-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pushurl-state-v1-

      - name: Push changed URLs
        id: push
        env:
          URL: ${{ secrets.URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          # 以下两项暂时留空即可自动停用：
          #   百度——站点暂时无法在百度站长平台添加，待可用后补配 token
          #   Bing Webmaster API——IndexNow 已能覆盖必应，通常不必再配
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          # runner 上下文只能用于 step 级别，不能写在 job 级别的 env 里
          STATE_DIR: ${{ runner.temp }}/pushurl-state
        run: |
          extra_flags=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            extra_flags="--dry_run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            extra_flags="$extra_flags --force"
          fi
          python pushUrl.py --url "$URL" --state_dir "$STATE_DIR" $extra_flags

      # 仅在确实完成推送时才写回缓存，避免无变更时产生无意义的缓存条目
      - name: Save submission fingerprints
        if: steps.push.outputs.pushed == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/pushurl-state
          key: ${{ steps.cache.outputs.cache-primary-key }}
